# Prometheus scrape config for Mossaid.
# Local: docker compose --profile observability up prometheus
# Scrapes the FastAPI /metrics endpoint (Prometheus exposition format).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: mossaid-api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics
