# Nginx gateway for Mossaid: TLS termination + rate limiting, proxy to FastAPI.
# Local: generate a self-signed cert into infra/certs/ (see README "TLS" section),
# then: docker compose --profile gateway up nginx
# Prod: mount a real cert/key (e.g. Let's Encrypt) at the same paths and set
# SERVER_NAME to the public hostname. HSTS is enabled — only use with valid TLS.

events {}

http {
    # Rate limits per product-evaluation.md §4 (auth & payment endpoints are Redis-
    # backed in-app too; this is the edge layer: per-IP leak buckets).
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=pay:10m rate=20r/m;
    limit_req_status 429;

    upstream api {
        server api:8000;
    }

    # Plain HTTP: redirect everything to HTTPS.
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        # Prod: replace _ with the public hostname.
        server_name _;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # HSTS (prod only — harmless locally, required for the §4 TLS bar).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Tight limits on abuse-prone endpoints (OTP, login, escrow).
        location ~ ^/api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location ~ ^/api/v1/(payments|admin)/ {
            limit_req zone=pay burst=10 nodelay;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Prometheus scrape is internal-only: the api service is reachable on the
        # compose network, and this edge location is closed to the outside.
        location = /metrics {
            deny all;
        }

        location / {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
