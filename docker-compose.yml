services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mossaid
      POSTGRES_PASSWORD: mossaid
      POSTGRES_DB: mossaid_simple
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mossaid"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: mossaid_simple
      DB_USERNAME: mossaid
      DB_PASSWORD: mossaid
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
